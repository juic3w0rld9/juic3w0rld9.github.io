<!DOCTYPE html>
<html>

<head>
    <script src=
"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js">
    </script>
  
    <!--jQuery code to show the working of delay method-->
    <script>
        $(document).ready(function () {
        
                $("#btn1").click(function () {
                    $("div").animate({
                        height: "150px"
                    });
                    $("div").animate({
                        width: "150px"
                    });
                    $("div").delay(1200).animate({
                        width: "300px",
                        padding: "30px"
                    });
                });
        });
    </script>
  
    <style>
        #d {
            display: block;
            width: 200px;
            height: 100px;
            background-color: rgb(149, 0, 255);
            font-size: 30px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="d">Never Switch</div>
  
    <!-- Click on this button to show 
        the effect of delay method -->
    <p>
        <button id="btn1">Click Me!</button>
    </p>
</body>

</html>
