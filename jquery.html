<!DOCTYPE html>
<html>

<head>
    <title>5 Jquery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .example-box {
            margin: 20px auto;
            padding: 20px;
            border: 2px solid rgb(149, 0, 255);
            width: 50%;
            box-sizing: border-box;
        }

        #Outer {
            border: 1px solid black;
            padding-top: 40px;
            height: 140px;
            background: rgb(149, 0, 255);
            display: none;
        }

        #d {
            display: block;
            width: 200px;
            height: 100px;
            background-color: rgb(149, 0, 255);
            font-size: 30px;
            padding: 10px;
            color: white;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div class="example-box">
        <div id="Outer">
            <h1 style="color:white;">Nesquik</h1>
        </div><br>
        <button id="btn-fade-toggle">Fade Toggle</button>
    </div>

    <div class="example-box">
        <div>
            <p>Hide</p>
            <button class="btn-slide-up">Slide up</button>
        </div>
    </div>


    <div class="example-box">
        <div>
            <p class="rental-text">Rental</p>
        </div>
        <button class="b1">Click me !</button>
    </div>


    <div class="example-box">
        <h1 style="color:rgb(149, 0, 255);">Mr.</h1>
        <h2 class="heartbreak-text">Heartbreak</h2>
        <button class="btn-fade-out">Fade out</button>
        <button class="btn-fade-in">Fade in</button>
    </div>

    <div class="example-box">
        <div id="d">Never Switch</div>
        <p>
            <button id="btn-delay">Click Me!</button>
        </p>
    </div>


    <script>
        $(document).ready(function () {

            $("#btn-fade-toggle").click(function () {
                $("#Outer").fadeToggle(1000);
            });


            $(".btn-slide-up").click(function () {
                $(this).siblings("p").slideUp();
            });


            $(".b1").click(function () {
                $(".rental-text").hide();
            });

 
            $(".btn-fade-out").click(function () {
                $(".heartbreak-text").fadeOut();
            });

            $(".btn-fade-in").click(function () {
                $(".heartbreak-text").fadeIn();
            });

            
            $("#btn-delay").click(function () {
                $("#d").animate({
                    height: "150px"
                });
                $("#d").animate({
                    width: "150px"
                });
                $("#d").delay(1200).animate({
                    width: "300px",
                    padding: "30px"
                });
            });
        });
    </script>
     <a href="portfolio.html" style="text-align: center;"> Back </a>

</body>

</html>
