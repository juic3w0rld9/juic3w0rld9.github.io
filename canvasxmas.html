<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuiceWRLD</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 2px solid #ccc;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <canvas id="cardCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("cardCanvas");
        const ctx = canvas.getContext("2d");

        function drawTree(offsetX, offsetY) {
            
            ctx.fillStyle = "#6d4c41";
            ctx.fillRect(offsetX - 15, offsetY + 60, 30, 45);

            ctx.fillStyle = "#1b5e20";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 10);
            ctx.lineTo(offsetX - 65, offsetY + 60);
            ctx.lineTo(offsetX + 65, offsetY + 60);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#2e7d32";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 45);
            ctx.lineTo(offsetX - 50, offsetY + 15);
            ctx.lineTo(offsetX + 50, offsetY + 15);
            ctx.closePath();
            ctx.fill();

            
            ctx.fillStyle = "#388e3c";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 80);
            ctx.lineTo(offsetX - 35, offsetY - 25);
            ctx.lineTo(offsetX + 35, offsetY - 25);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = "#fbc02d";
            ctx.beginPath();
            ctx.arc(offsetX, offsetY - 85, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        drawTree(200, 240);

        ctx.fillStyle = "purple";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "left";
        
        ctx.fillText("XMast List", 320, 210);
        ctx.fillText("Merry Christmas", 320, 250);
    </script>
    <a href ="portfolio.html">Back</a>
</body>
</html>
