<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Greeting Card - Maligayang Pasko</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 2px solid #ccc;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <canvas id="cardCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("cardCanvas");
        const ctx = canvas.getContext("2d");

        function drawSnowman(offsetX, offsetY) {
            ctx.fillStyle = "#e0e0e0";
            ctx.beginPath();
            ctx.arc(offsetX, offsetY + 60, 45, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(offsetX, offsetY, 32, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(offsetX, offsetY - 45, 22, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#333333";
            ctx.beginPath();
            ctx.arc(offsetX - 7, offsetY - 50, 3, 0, Math.PI * 2);
            ctx.arc(offsetX + 7, offsetY - 50, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#d35400";
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY - 45);
            ctx.lineTo(offsetX + 15, offsetY - 43);
            ctx.lineTo(offsetX, offsetY - 40);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#333333";
            ctx.beginPath();
            ctx.arc(offsetX, offsetY - 5, 2, 0, Math.PI * 2);
            ctx.arc(offsetX, offsetY + 15, 2, 0, Math.PI * 2);
            ctx.arc(offsetX, offsetY + 35, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        drawSnowman(200, 240);

        ctx.fillStyle = "#1a52b8";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "left";
        
        ctx.fillText("X-Mast List", 320, 210);
        ctx.fillText("Merry Christmas", 320, 250);

        function drawBlueCircles() {
            for (let i = 0; i < 15; i++) {
                const x = Math.random() * 300 + 450;
                const y = Math.random() * 400 + 50;
                const radius = Math.random() * 4 + 2;
                
                const hue = Math.floor(Math.random() * 40) + 195;
                const lightness = Math.floor(Math.random() * 50) + 35;
                ctx.fillStyle = "hsl(" + hue + ", 85%, " + lightness + "%)";
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        drawBlueCircles();
    </script>
    <a href ="portfolio.html">Back</a>
</body>
</html>
