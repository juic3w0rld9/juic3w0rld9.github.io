<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuiceWRLD - Gallery</title>
    <link rel="stylesheet" href="juice.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        :root {
            --surface: #000000;
            --border-yellow: #fef600;
            --accent: #780ad3;
        }

        h1 {
            text-align: center;
            margin-top: 24px;
            color: #ffffff;
        }

        .carousel-wrapper {
            width: 100%;
            max-width: 850px;
            margin: 24px auto 40px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .carousel {
            position: relative;
            width: 100%;
            background: var(--surface);
            border: 2px solid var(--border-yellow);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(254, 246, 0, 0.15);
            overflow: hidden;
        }

        .slides {
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
            background-color: #4a1e78;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            display: none;
        }

        .slide:first-child {
            display: block;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            border-top: 1px solid var(--border-yellow);
        }

        figcaption:empty {
            display: none;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #4a1e78;
            color: #ffffff;
            border: 1px solid var(--border-yellow);
            font-size: 18px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .nav:hover {
            background: var(--accent);
        }

        .prev {
            left: 14px;
        }

        .next {
            right: 14px;
        }

        .dots {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border-yellow);
            background: #4a1e78;
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 0;
        }

        .dot.active {
            background: #a855f7;
            border-color: var(--border-yellow);
            transform: scale(1.25);
        }

        .back-link {
            text-align: center;
            margin-bottom: 24px;
        }

        .back-link a {
            color: var(--border-yellow);
        }

        footer p {
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li class="nav-item"><a href="juice.html">Home</a></li>
                <li class="nav-item"><a href="about.html">About</a></li>
                <li class="nav-item active"><a href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a href="portfolio.html">Portfolio</a></li>
                <li class="nav-item"><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">

        <div class="carousel-wrapper">
            <div class="carousel" id="carousel">
                <div class="slides">
                    <figure class="slide">
                        <img src="junkie999.jpeg" alt="Juice WRLD Photo 1">
                        <figcaption>Me</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="juicef.jpeg" alt="Juice WRLD Family">
                        <figcaption>Future me</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="Juice wrld.jpeg" alt="Juice WRLD Family">
                        <figcaption>JuiceWRLD</figcaption>
                    </figure>
                    <figure class="slide">
                        <img src="juice2.jpeg" alt="Death Race For Love">
                        <figcaption>Homie</figcaption>
                    </figure>

                    <button class="nav prev" type="button" aria-label="Previous slide">&#10094;</button>
                    <button class="nav next" type="button" aria-label="Next slide">&#10095;</button>
                </div>
            </div>
            <div class="dots"></div>
        </div>
    </main>

    <footer>
        <p>&copy; Juice Corp | Jarad</p>
    </footer>

    <script>
        $(document).ready(function () {
            const $carousel = $('#carousel');
            const $slides = $carousel.find('.slide');
            const $dotsBox = $('.dots');
            const total = $slides.length;
            const FADE_TIME = 400;
            const DELAY = 4000;

            let current = 0;
            let timer = null;

            $slides.hide().eq(0).show();

            $slides.each(function (i) {
                $('<button>')
                    .attr({ type: 'button', 'aria-label': 'Go to slide ' + (i + 1) })
                    .addClass('dot' + (i === 0 ? ' active' : ''))
                    .data('index', i)
                    .appendTo($dotsBox);
            });

            const $dots = $dotsBox.find('.dot');

            function showSlide(index) {
                const nextIndex = (index + total) % total;
                if (nextIndex === current) return;

                $slides.eq(current).stop(true, true).fadeOut(FADE_TIME);
                $slides.eq(nextIndex).stop(true, true).fadeIn(FADE_TIME);
                $dots.removeClass('active').eq(nextIndex).addClass('active');

                current = nextIndex;
            }

            function startAutoplay() {
                stopAutoplay();
                timer = setInterval(function () {
                    showSlide(current + 1);
                }, DELAY);
            }

            function stopAutoplay() {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }

            function resetAutoplay() {
                stopAutoplay();
                startAutoplay();
            }

            $carousel.on('click', '.next', function () {
                showSlide(current + 1);
                resetAutoplay();
            });

            $carousel.on('click', '.prev', function () {
                showSlide(current - 1);
                resetAutoplay();
            });

            $dotsBox.on('click', '.dot', function () {
                showSlide($(this).data('index'));
                resetAutoplay();
            });

            $carousel
                .on('mouseenter', stopAutoplay)
                .on('mouseleave', startAutoplay);

            $(document).on('keydown', function (e) {
                if (e.key === 'ArrowRight') {
                    showSlide(current + 1);
                    resetAutoplay();
                } else if (e.key === 'ArrowLeft') {
                    showSlide(current - 1);
                    resetAutoplay();
                }
            });

            startAutoplay();
        });
    </script>
</body>

</html>
